<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Folders</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="title-bar">
      <div class="title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Папки проектов</span>
      </div>
      <div class="actions">
        <button id="btn-add-folder" class="btn-icon" title="Создать папку">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </button>
        <button id="btn-refresh" class="btn-icon" title="Синхронизировать">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Input -->
    <div class="search-container">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" class="search-input" placeholder="Поиск проектов и чатов..." autocomplete="off">
    </div>

    <!-- Statistics -->
    <div class="stats-bar">
      <span id="stats-summary">Загрузка...</span>
      <span id="ls-status" title="Связь с Language Server">●</span>
    </div>
  </header>

  <!-- Interactive Project Tree -->
  <main id="tree-container" class="tree-container">
    <div class="empty-state">Синхронизация с Antigravity...</div>
  </main>

  <!-- Add / Edit Folder Modal -->
  <div id="folder-modal" class="modal-overlay" style="display: none;">
    <div class="modal">
      <div class="modal-title" id="modal-title">Новая папка</div>
      <input type="text" id="modal-folder-name" class="modal-input" placeholder="Название папки" maxlength="50">
      
      <div style="font-size: 11.5px; color: var(--muted-fg);">Цветовая метка:</div>
      <div class="color-picker" id="modal-colors">
        <div class="color-option selected" data-color="#3b82f6" style="background-color: #3b82f6;"></div>
        <div class="color-option" data-color="#10b981" style="background-color: #10b981;"></div>
        <div class="color-option" data-color="#f59e0b" style="background-color: #f59e0b;"></div>
        <div class="color-option" data-color="#ef4444" style="background-color: #ef4444;"></div>
        <div class="color-option" data-color="#8b5cf6" style="background-color: #8b5cf6;"></div>
        <div class="color-option" data-color="#ec4899" style="background-color: #ec4899;"></div>
        <div class="color-option" data-color="#64748b" style="background-color: #64748b;"></div>
      </div>

      <div class="modal-buttons">
        <button id="modal-btn-cancel" class="btn btn-secondary">Отмена</button>
        <button id="modal-btn-save" class="btn btn-primary">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script src="/app.js"></script>
</body>
</html>
